{% extends "layout.html" %}

{% block title %}
Chai Details Page
{% endblock %}

{% block content %}
<div class="flex flex-col gap-3 p-6 items-center border border-gray-100 rounded-md">
    <h1 class="font-medium">Chai Details</h1>
    <img src="{{chai.image.url}}" height="100" width="100">
    <h3 class="font-semibold">{{chai.name}}</h3>
    <p>{{chai.description}}</p>
    <p>${{chai.price}}</p>
</div>

{% endblock %}
